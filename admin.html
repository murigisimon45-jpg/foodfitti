  font-family:"Fraunces",Georgia,serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

input,select,textarea{
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  width:100%;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(232,163,23,.18)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow)
}

.pill{
  border-radius:999px
}

.chip{
  border:1px solid var(--line);
  background:var(--surface2);
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700
}

.btn-navy{
  background:var(--navy);
  color:var(--bg);
  border-radius:12px;
  padding:11px 16px;
  font-weight:800;
  border:0
}

.btn-gold{
  background:var(--gold);
  color:#1a1200;
  border-radius:12px;
  padding:11px 16px;
  font-weight:800;
  border:0
}

.btn-ghost{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  font-weight:700
}

.tab{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  font-weight:700
}

.tab.active{
  background:var(--navy);
  color:var(--bg);
  border-color:var(--navy)
}

.logo-pill{
  background:#fff;
  border-radius:999px;
  padding:6px 12px;
  display:inline-flex;
  align-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.08)
}

.logo-pill img{
  height:46px;
  width:auto;
  -o-object-fit:contain;
     object-fit:contain;
  display:block
}

@media(max-width:640px){
  .logo-pill img{
    height:38px
  }
}

pre{
  white-space:pre-wrap;
  word-break:break-word
}

@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:pt-9 {
    padding-top: 2.25rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-\[1fr_180px_auto\] {
    grid-template-columns: 1fr 180px auto;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.15fr_\.85fr\] {
    grid-template-columns: 1.15fr .85fr;
  }
}

<script>
/* Foodfitti — Keep UI clean: remove any backend / Supabase / Deploy help writings from the visible UI. No keys here. */
(function(){
  function clean(){
    try{
      var els = document.querySelectorAll('div,section,article,p,li,span,h1,h2,h3,h4,textarea,button');
      for(var i=0;i<els.length;i++){
        var t = (els[i].textContent||'').trim();
        // Only remove blocks that are clearly backend/deploy help, not order/price content
        if(t.indexOf('Deployment SQL')!==-1 || t.indexOf('Supabase SQL Editor')!==-1 || t.indexOf('Create permissive policies')!==-1 || (t.indexOf('Supabase:')!==-1 && t.indexOf('run the SQL')!==-1)){
          var card = els[i].closest('div');
          if(card) { card.style.display='none'; }
        }
        if(t.indexOf('Deploy help')!==-1 || t.indexOf('Deployment help')!==-1){
          var c2 = els[i].closest('div');
          if(c2) c2.style.display='none';
        }
      }
      // Hide any textarea that contains Supabase SQL
      var tas = document.querySelectorAll('textarea');
      for(var j=0;j<tas.length;j++){
        if((tas[j].value||'').indexOf('foodfitti_orders')!==-1 || (tas[j].value||'').indexOf('supabase')!==-1){
          var p = tas[j].closest('div');
          if(p) p.style.display='none';
          tas[j].style.display='none';
        }
      }
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){ clean(); setTimeout(clean, 800); setTimeout(clean, 2000); });
  var obs = new MutationObserver(function(){ clean(); });
  document.addEventListener('DOMContentLoaded', function(){ try{ obs.observe(document.body, {childList:true, subtree:true}); }catch(e){} });
})();
</script>

<script>
/* Foodfitti Auto-Sync 2s — reloads only when data changed AND not on passcode/login screen AND not typing. */
(function(){
  var lastHash='';
  var busy=false;
  function onPasscodeScreen(){
    try{
      var t=document.body ? document.body.innerText : '';
      // If we see Create Passcode / Enter Passcode and NO orders table, don't auto-reload (would loop)
      if(t.indexOf('Create Passcode')!==-1 || t.indexOf('Set Passcode')!==-1) return true;
      if(t.indexOf('Enter Passcode')!==-1 && t.indexOf('Orders')===-1) return true;
    }catch(e){}
    return false;
  }
  function isEditing(){
    try{
      var a=document.activeElement;
      if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable)) return true;
    }catch(e){}
    return false;
  }
  async function poll(){
    if(busy || document.hidden || isEditing() || onPasscodeScreen()) return;
    busy=true;
    try{
      var lists=['foodfitti_orders','foodfitti_settings','foodfitti_tracking','foodfitti_theme'];
      var parts=[];
      for(var i=0;i<lists.length;i++){
        try{
          var r=await fetch('actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'records.list',args:{collection:lists[i]}})});
          if(!r.ok) continue;
          var j=await r.json();
          var recs=(j&&j.data&&j.data.records)?j.data.records:[];
          parts.push(lists[i]+':'+JSON.stringify(recs));
        }catch(e){}
      }
      if(!parts.length){busy=false;return;}
      var h=parts.join('|'); var hash=0; for(var k=0;k<h.length;k++){hash=((hash<<5)-hash)+h.charCodeAt(k);hash|=0;}
      var hs=String(hash);
      if(lastHash===''){lastHash=hs;}
      else if(lastHash!==hs){lastHash=hs; if(!isEditing() && !onPasscodeScreen()) location.reload();}
    }catch(e){}
    busy=false;
  }
  setTimeout(function(){ poll(); setInterval(poll, 2000); }, 2500);
})();
</script>
