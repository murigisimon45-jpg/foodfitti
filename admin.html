<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foodfitti Admin — Murigi-inc</title>
<style>:root{--navy:#0f2a5c;--bg:#f4f6fb;--card:#fff;--text:#111}body.dark{--bg:#0f1420;--card:#1a2236;--text:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between}button{background:var(--navy);color:#fff;border:0;padding:11px 14px;border-radius:10px;font-weight:700;cursor:pointer}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:6px 0;background:var(--card);color:var(--text)}.wrap{max-width:640px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none!important}.order{border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}.muted{font-size:12px;opacity:.7}</style></head><body>
<header><b>FOODFITTI ADMIN</b><button style="width:auto" onclick="document.body.classList.toggle('dark')">🌙</button></header>
<div class="wrap">
<div id="auth" class="card"><h3 id="authTitle">Loading…</h3><label>Passcode</label><input id="pass" type="password" placeholder="Enter passcode"><button id="authBtn" onclick="doAuth()">Continue</button><p class="muted" id="authMsg">No demo passcode. Create your own private passcode first time, then use Login after refresh.</p></div>
<div id="main" class="hidden">
<div class="tabs"><button onclick="tab('orders')">Orders</button><button onclick="tab('settings')">Settings</button></div>
<div id="tabOrders" class="card"><h3>Orders <span id="liveDot">🟢 Live</span></h3><div id="orders">Loading…</div><button onclick="loadAll()">Refresh (manual only)</button></div>
<div id="tabSettings" class="card hidden"><h3>Settings</h3><label>WhatsApp Number (254… no +)</label><input id="sWa" placeholder="254700000000"><label>Pochi / M-Pesa Number</label><input id="sPochi" placeholder="0700000000"><label>Kitengela Fee</label><input id="sKit" type="number" value="150"><label>Mlolongo Fee</label><input id="sMlo" type="number" value="100"><button onclick="saveSettings()">Save Settings</button><p class="muted" id="setMsg"></p><p class="muted">Settings save to foodfitti-settings-v1 and show on customer app within 2s. No Deployment section here.</p></div>
</div></div>
<script>
let passExists=false, authed=false, orders=[];
async function api(a,args){try{let r=await fetch('/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,args:args||{}})}); let j=await r.json(); return j.data||j;}catch(e){return null}}
async function init(){let d=await api('records.list',{collection:'foodfitti_admin'}); let rec=null; if(d&&d.records) rec=d.records.find(x=>x.value&&x.value.type==='passcode'); passExists=!!rec; document.getElementById('authTitle').textContent=passExists?'Admin Login — Enter Passcode':'Create Your Private Passcode'; document.getElementById('authBtn').textContent=passExists?'Login':'Create Passcode'; if(passExists){let s=await api('records.list',{collection:'foodfitti_settings'}); if(s&&s.records){let st=s.records.find(x=>String(x.id)==='foodfitti-settings-v1'); if(st&&st.value){document.getElementById('sWa').value=st.value.whatsapp||''; document.getElementById('sPochi').value=st.value.pochi||st.value.pochiNo||''; document.getElementById('sKit').value=st.value.kitengela||150; document.getElementById('sMlo').value=st.value.mlolongo||100;}}}}
async function doAuth(){let p=document.getElementById('pass').value.trim(); if(p.length<4) return alert('Passcode must be 4+ chars'); if(!passExists){let r=await api('records.create',{collection:'foodfitti_admin', id:'admin-passcode-v1', value:{type:'passcode', passcode:p}}); if(!r) return alert('Could not save — check backend'); passExists=true; authed=true;} else {let d=await api('records.list',{collection:'foodfitti_admin'}); let rec=d.records.find(x=>x.value&&x.value.type==='passcode'); if(!rec||rec.value.passcode!==p) return alert('Wrong passcode'); authed=true;} document.getElementById('auth').classList.add('hidden'); document.getElementById('main').classList.remove('hidden'); loadAll();}
function tab(t){document.getElementById('tabOrders').classList.toggle('hidden',t!=='orders'); document.getElementById('tabSettings').classList.toggle('hidden',t!=='settings');}
async function loadAll(){if(!authed) return; let d=await api('records.list',{collection:'foodfitti_orders'}); let tr=await api('records.list',{collection:'foodfitti_tracking'}); if(d&&d.records) orders=d.records.map(r=>({id:r.id,value:r.value})); if(tr&&tr.records){let m={}; tr.records.forEach(r=>{if(r.value&&r.value.orderId) m[r.value.orderId]=r.value.status}); orders.forEach(o=>{if(m[o.value.orderId]) o.value={...o.value,status:m[o.value.orderId]}});} render();}
function render(){let el=document.getElementById('orders'); if(!orders.length){el.innerHTML='<p>No orders yet.</p>'; return;} el.innerHTML=orders.slice().reverse().map(o=>{let v=o.value; return `<div class="order"><b>${v.orderId}</b> — ${v.name} • ${v.phone}<br>${v.qty} x ${v.type} ${v.type==='sweet'?(v.flavors||[]).join(', '):''} • ${v.location} • KSh ${v.total}<br>M-Pesa: ${v.mpesaCode||''} • <b>${v.status}</b><br><select onchange="changeStatus('${o.id}','${v.orderId}',this.value)"><option ${v.status==='Preparing'?'selected':''}>Preparing</option><option ${v.status==='Packed'?'selected':''}>Packed</option><option ${v.status==='On its way'?'selected':''}>On its way</option><option ${v.status==='Delivered'?'selected':''}>Delivered</option></select></div>`}).join('');}
async function changeStatus(id,orderId,st){let o=orders.find(x=>x.id===id); if(!o) return; let nv={...o.value,status:st,trackingStatus:st}; await api('records.replace',{collection:'foodfitti_orders', id:id, value:nv}); await api('records.create',{collection:'foodfitti_tracking', id:'track-'+orderId, value:{orderId,status:st,updatedAt:new Date().toISOString()}}); o.value=nv; render();}
async function saveSettings(){let v={whatsapp:document.getElementById('sWa').value.trim(), pochi:document.getElementById('sPochi').value.trim(), pochiNo:document.getElementById('sPochi').value.trim(), kitengela:+document.getElementById('sKit').value||150, mlolongo:+document.getElementById('sMlo').value||100}; if(!v.whatsapp||!v.pochi) return alert('Fill WhatsApp and Pochi'); let r=await api('records.replace',{collection:'foodfitti_settings', id:'foodfitti-settings-v1', value:v}); document.getElementById('setMsg').textContent=r?'Saved! Customer app will show new numbers in ~2s.':'Save failed — check backend';}
init(); setInterval(()=>{if(authed) loadAll();},2000);
</script></body></html>
