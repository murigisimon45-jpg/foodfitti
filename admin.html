:root{
  --bg:#f6f8fc;
  --surface:#ffffff;
  --surface2:#eef2fb;
  --ink:#0a1f44;
  --muted:#5b6a85;
  --line:#dbe3f2;
  --navy:#0a1f44;
  --navy2:#122f66;
  --gold:#e8a317;
  --green:#147a4d;
  --amber:#a66a00;
  --red:#b3261e;
  --shadow:0 18px 45px rgba(10,31,68,.10);
}

[data-theme="dark"]{
  --bg:#071426;
  --surface:#0d2446;
  --surface2:#132c54;
  --ink:#f2f6ff;
  --muted:#a9b8d4;
  --line:#243d6b;
  --navy:#ffffff;
  --navy2:#dce7ff;
  --gold:#ffc233;
  --shadow:0 18px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,sans-serif
}

.font-display{
  font-family:"Fraunces",Georgia,serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

input,select,textarea{
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  width:100%;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(232,163,23,.18)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow)
}

.pill{
  border-radius:999px
}

.chip{
  border:1px solid var(--line);
  background:var(--surface2);
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700
}

.btn-navy{
  background:var(--navy);
  color:var(--bg);
  border-radius:12px;
  padding:11px 16px;
  font-weight:800;
  border:0
}

.btn-gold{
  background:var(--gold);
  color:#1a1200;
  border-radius:12px;
  padding:11px 16px;
  font-weight:800;
  border:0
}

.btn-ghost{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  font-weight:700
}

.tab{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  font-weight:700
}

.tab.active{
  background:var(--navy);
  color:var(--bg);
  border-color:var(--navy)
}

.logo-pill{
  background:#fff;
  border-radius:999px;
  padding:6px 12px;
  display:inline-flex;
  align-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.08)
}

.logo-pill img{
  height:46px;
  width:auto;
  -o-object-fit:contain;
     object-fit:contain;
  display:block
}

@media(max-width:640px){
  .logo-pill img{
    height:38px
  }
}

pre{
  white-space:pre-wrap;
  word-break:break-word
}

  .sm\:col-span-2 {
    grid-column: span 2 / span 2;

    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:pt-9 {
    padding-top: 2.25rem;
  }
}

  .md\:grid-cols-\[1fr_180px_auto\] {
